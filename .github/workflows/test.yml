name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: sh .github/build.sh ${{ matrix.target }}
      - name: Installer
        run: |
          sh -n install.sh
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/agents" "$dist/agents-${{ matrix.target }}"
          (cd "$dist" && shasum -a 256 agents-* > SHA256SUMS)
          AGENTS_BIN_DIR="$RUNNER_TEMP/bin" AGENTS_DOWNLOAD_URL="file://$dist" PATH="/usr/bin:/bin:/usr/sbin:/sbin" sh install.sh
          "$RUNNER_TEMP/bin/agents" --version
          "$RUNNER_TEMP/bin/fzf" --version

  # every program a release publishes has to keep building
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf }
          - { os: ubuntu-latest, target: arm-unknown-linux-musleabihf }
          - { os: ubuntu-latest, target: powerpc64le-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sh .github/build.sh ${{ matrix.target }}
