name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Installer
        run: |
          sh -n install.sh
          AGENTS_BIN_DIR="$RUNNER_TEMP/bin" AGENTS_REF="$GITHUB_SHA" PATH="/usr/bin:/bin:/usr/sbin:/sbin:$(dirname "$(command -v python3)")" sh install.sh
          "$RUNNER_TEMP/bin/agents" --version
          "$RUNNER_TEMP/bin/fzf" --version
