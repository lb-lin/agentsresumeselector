name: release

# A tag v0.9.0 publishes the programs install.sh downloads; a tag with a dash (v0.9.0-rc1) is a
# prerelease: installable with AGENTS_REF, never what "the newest" gives anyone.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf }
          - { os: ubuntu-latest, target: arm-unknown-linux-musleabihf }
          - { os: ubuntu-latest, target: powerpc64le-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sh .github/build.sh ${{ matrix.target }}
      - run: cp "target/${{ matrix.target }}/release/agents" "agents-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: agents-${{ matrix.target }}
          path: agents-${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum agents-* > SHA256SUMS
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease * ;;
            *) gh release create "$GITHUB_REF_NAME" --generate-notes * ;;
          esac
